name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          # No explicit "qttools" module: aqtinstall now bundles
          # Qt6LinguistTools (lupdate/lrelease) into the base install by
          # default for recent Qt versions, and asking for a module that
          # no longer exists as a separate package aborts the whole
          # install rather than just warning (confirmed directly: this
          # broke both CI jobs, and separately while fetching Qt 6.11.1
          # for a from-scratch Ubuntu 20.04 build -- see PLAN.md item 13).

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          # No explicit "qttools" module -- see the Windows job's comment.
          # Qt6::DBus (used by platform/linux/linuxplatformshell.cpp) is
          # expected to ship as part of aqtinstall's base qtbase archive;
          # if a future Qt version splits either back out into its own
          # module, this is the first place to add it back.

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          # ubuntu-latest has no X server at all -- the tests that need a
          # real QApplication (anything not using QTEST_GUILESS_MAIN, e.g.
          # they touch QAction/QClipboard/QMessageBox/QFileIconProvider)
          # fail with "could not connect to display" without this. Qt's
          # offscreen platform plugin is built specifically for exactly
          # this: headless CI runs of real widget-based tests.
          QT_QPA_PLATFORM: offscreen
